name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m decentralized_stress validate-data --root .
      - run: python -m decentralized_stress smoke --root . --output-dir results/ci-smoke
      - run: python -m decentralized_stress verify --root . --result-dir results/ci-smoke
      - run: python -m decentralized_stress smoke --root . --config configs/ring_smoke.json --output-dir results/ci-ring-smoke
      - run: python -m decentralized_stress verify --root . --result-dir results/ci-ring-smoke

  full-cpu-benchmark:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - run: python -m pip install -e .
      - name: Verify committed benchmark evidence
        run: python -m decentralized_stress verify --root . --result-dir results/benchmark
      - run: python -m decentralized_stress benchmark --root . --output-dir results/ci-benchmark
      - run: python -m decentralized_stress verify --root . --result-dir results/ci-benchmark
      - name: Upload verified CPU benchmark
        uses: actions/upload-artifact@v4
        with:
          name: decentralized-learning-cpu-${{ github.sha }}
          path: results/ci-benchmark
          if-no-files-found: error
          retention-days: 30
